packages:
  - "packages/*"
  - "apps/*"
  - "generators/*"
  - "configs"

allowBuilds:
  "@vscode/vsce-sign": true
  esbuild: true
  keytar: true

catalog:
  "@changesets/cli": "^2.31.0"
  "@types/inquirer": "^9.0.9"
  "@types/mocha": "^10.0.10"
  "@types/node": "25.x"
  "chalk": "^5.6.2"
  "colorette": "^2.0.20"
  "commander": "^14.0.3"
  eslint: "^10.2.1"
  "inquirer": "^13.4.2"
  "ora": "^9.4.0"
  ts-morph: ^28.0.0
  turbo: "^2.9.6"
  typescript: "^6.0.3"
  typescript-eslint: "^8.59.1"
  vite: npm:@voidzero-dev/vite-plus-core@latest
  vite-plus: latest
  vitest: npm:@voidzero-dev/vite-plus-test@latest
  vue: ^3.5.33
  zod: ^4.3.6
overrides:
  vite: "catalog:"
  vitest: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
